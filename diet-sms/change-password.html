<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Change password</title><link rel="stylesheet" href="/style.css"></head>
<body><div class="narrow"><div class="card">
  <h2>Change your password</h2>
  <p class="muted" style="margin-top:0">Choose a new password of at least 8 characters. You will use it from now on.</p>
  <form id="f">
    <label for="old">Current password</label><input id="old" type="password" autocomplete="current-password" required>
    <label for="n1">New password</label><input id="n1" type="password" autocomplete="new-password" minlength="8" required>
    <label for="n2">New password again</label><input id="n2" type="password" autocomplete="new-password" minlength="8" required>
    <p id="msg" class="msg"></p>
    <div class="row" style="margin-top:8px"><button id="go">Save password</button><button type="button" class="ghost" id="out">Log out</button></div>
  </form>
</div></div>
<script type="module">
import { api, homeFor, say, logout } from "/common.js";
let me;
try { me = (await api("/api/me")).user; } catch { location.replace("/"); }
document.getElementById("out").onclick = logout;
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("msg");
  const n1 = document.getElementById("n1").value;
  if (n1 !== document.getElementById("n2").value) return say(msg, "The two new passwords are different", "err");
  try {
    await api("/api/change-password", { oldPassword: document.getElementById("old").value, newPassword: n1 });
    location.replace(homeFor(me.role));
  } catch (err) { say(msg, err.message, "err"); }
});
</script></body></html>
