<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>First-time setup</title><link rel="stylesheet" href="/style.css"></head>
<body><div class="narrow"><div class="card">
  <h2>Create the admin account</h2>
  <p class="muted" style="margin-top:0">Use this once. You need the SETUP_KEY you saved in Cloudflare. It stops working as soon as an admin exists.</p>
  <form id="f">
    <label>Setup key</label><input id="key" type="password" required>
    <label>Admin Login ID</label><input id="login" value="admin" autocapitalize="off" required>
    <label>Admin name</label><input id="name" value="Administrator" required>
    <label>Password (8+ characters)</label><input id="pw" type="password" minlength="8" autocomplete="new-password" required>
    <p id="msg" class="msg"></p>
    <button style="width:100%;margin-top:8px">Create admin</button>
  </form>
</div></div>
<script type="module">
import { api, say } from "/common.js";
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("msg");
  try {
    await api("/api/setup", { key: document.getElementById("key").value, loginId: document.getElementById("login").value, name: document.getElementById("name").value, password: document.getElementById("pw").value });
    say(msg, "Admin created. Taking you to the login page...", "ok");
    setTimeout(() => location.replace("/"), 1200);
  } catch (err) { say(msg, err.message, "err"); }
});
</script></body></html>
