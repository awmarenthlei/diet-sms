<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DIET Serchhip: Student</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header class="top"><h1>DIET Serchhip</h1><div><span class="who" id="who"></span> <button class="ghost sm" id="out">Log out</button></div></header>
<main>
  <div class="card"><h3 style="margin:0" id="s-name"></h3><p class="muted" style="margin:4px 0 0" id="s-info"></p></div>
</main>
<nav class="seg" id="tabs">
  <button data-t="att" class="on">Attendance</button><button data-t="marks">Marks</button><button data-t="tt">Timetable</button><button data-t="past">Past</button>
</nav>
<main>
<section id="t-att">
  <div class="card" id="a-over"></div>
  <div class="card"><h3 style="margin-top:0">By subject</h3><div class="slist" id="a-list"></div>
    <p class="muted" style="margin-bottom:0">80% attendance is needed. Red means below 80%.</p></div>
</section>
<section id="t-marks" class="hidden"><div id="m-box"></div></section>
<section id="t-tt" class="hidden"><div id="tt-box"></div></section>
<section id="t-past" class="hidden"><div id="p-box"></div></section>
</main>
<script type="module">
import { api, requireUser, logout, esc } from "/common.js";
const $ = (id) => document.getElementById(id);
const me = await requireUser(["student"]);
$("who").textContent = me.name; $("out").onclick = logout;
let data, loaded = {};
const pct = (p, t) => (t ? Math.round((p / t) * 1000) / 10 : null);
const fmt = (n) => (n === null || n === undefined ? "-" : Number(n));

try { data = await api("/api/student/me"); } catch (e) { document.querySelector("main").innerHTML = `<div class="card"><p>${esc(e.message)}</p></div>`; throw e; }
const st = data.student;
$("s-name").textContent = st.name;
$("s-info").textContent = `${st.class} · Roll ${st.rollNo}${st.batch ? " · Batch " + st.batch : ""}`;

function drawAtt() {
  const o = data.overall, v = pct(o.present, o.total);
  $("a-over").innerHTML = o.total
    ? `<div style="display:flex;justify-content:space-between;align-items:baseline"><b>Overall attendance</b><span class="pct" style="font-size:22px"><b style="${v < 80 ? "color:var(--danger)" : ""}">${v}%</b></span></div>
       <div class="bar ${v < 80 ? "low" : ""}" style="margin:8px 0"><i style="width:${v}%"></i></div>
       <p class="muted" style="margin:0">${o.present} attended out of ${o.total} classes. ${v >= 80 ? "You meet the 80% requirement." : "You are below the 80% requirement."}</p>`
    : `<b>Overall attendance</b><p class="muted" style="margin:6px 0 0">No classes have been recorded yet.</p>`;
  $("a-list").innerHTML = data.attendance.map((x) => {
    const p = pct(x.present, x.total);
    return `<div class="srow"><span class="nm">${esc(x.name)}${x.optional ? ` <span class="badge">Optional</span>` : ""}<br><span class="muted">${esc(x.subjectId)}</span></span>
      <span class="pct">${x.present}/${x.total} <b style="${p !== null && p < 80 ? "color:var(--danger)" : ""}">${p === null ? "-" : p + "%"}</b><div class="bar ${p !== null && p < 80 ? "low" : ""}"><i style="width:${p || 0}%"></i></div></span></div>`;
  }).join("") || `<p class="muted">No subjects yet.</p>`;
}
function drawMarks() {
  const by = {}; data.marks.forEach((m) => { (by[m.subjectId] ||= { name: m.subject, rows: [] }).rows.push(m); });
  $("m-box").innerHTML = Object.values(by).map((g) => `<div class="card"><h3 style="margin-top:0">${esc(g.name)}</h3>${g.rows.map((m) =>
    `<div class="srow"><span class="nm">${esc(m.exam)}</span><span class="pct"><b>${m.score}</b> / ${m.max}</span></div>`).join("")}</div>`).join("")
    || `<div class="card"><p class="muted" style="margin:0">No marks have been entered yet.</p></div>`;
}
async function drawTT() {
  const r = await api("/api/timetable?class=" + encodeURIComponent(st.class));
  const name = {}; r.subjects.forEach((s) => { name[s.subjectId] = s.name; });
  const mine = new Set(data.attendance.map((x) => x.subjectId));
  const days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"], by = {}; r.timetable.forEach((d) => { by[d.day] = d; });
  const body = days.filter((d) => by[d] && [1, 2, 3, 4].some((n) => by[d]["p" + n])).map((d) =>
    `<div class="day"><b>${d}</b>${[1, 2, 3, 4].map((n) => { const id = by[d]["p" + n]; return `<div class="p ${mine.has(id) ? "mine" : ""}"><span>P${n}</span><span>${id ? esc(name[id] || id) : "&ndash;"}</span></div>`; }).join("")}</div>`).join("");
  $("tt-box").innerHTML = `<div class="card"><h3 style="margin-top:0">${esc(st.class)}</h3>${body || `<p class="muted">No timetable has been set yet.</p>`}</div>`;
}
async function drawPast() {
  const r = (await api("/api/student/past")).results, by = {};
  r.forEach((x) => { (by[x.semester] ||= []).push(x); });
  $("p-box").innerHTML = Object.entries(by).map(([sem, rows]) => `<div class="card"><h3 style="margin-top:0">${esc(sem)}</h3>${rows.map((x) =>
    `<div class="srow"><span class="nm">${esc(x.name || x.subjectId)}<br><span class="muted">Internal ${fmt(x.io)}/${fmt(x.ifull)} · External ${fmt(x.eo)}/${fmt(x.efull)}</span></span><span class="pct">${esc(x.status || "")}</span></div>`).join("")}</div>`).join("")
    || `<div class="card"><p class="muted" style="margin:0">No earlier results on record.</p></div>`;
}
const draw = { att: drawAtt, marks: drawMarks, tt: drawTT, past: drawPast };
$("tabs").onclick = (e) => {
  const t = e.target.dataset.t; if (!t) return;
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.t === t));
  ["att", "marks", "tt", "past"].forEach((x) => $("t-" + x).classList.toggle("hidden", x !== t));
  if (!loaded[t]) { loaded[t] = true; Promise.resolve(draw[t]()).catch((err) => alert(err.message)); }
};
loaded.att = true; drawAtt();
</script></body></html>
